<mat-sidenav-container autosize>
  <mat-sidenav #sideNav [mode]="isSmallScreen() ?'over' :'side'" align="start" opened 
  [fixedInViewport]="isSmallScreen()" [style.width]="isSmallScreen() ? '280px': sidenavWidth()">
    <lib-sidebar-custom [isCollapsed]="isCollapsed()"></lib-sidebar-custom>
  </mat-sidenav>
  <mat-sidenav-content [style.margin-left]="isSmallScreen() ? '0px': sidenavWidth()">
    <mat-toolbar>
      <lib-navbar-custom></lib-navbar-custom>
    </mat-toolbar>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
